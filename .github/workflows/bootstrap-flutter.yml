name: Bootstrap Flutter Android project

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-flutter-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository into a valid Dart project directory
        uses: actions/checkout@v4
        with:
          path: test_app
          token: ${{ github.token }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android-only Flutter project
        working-directory: test_app
        run: flutter create --platforms android .

      - name: Commit generated project and remove this one-time workflow
        working-directory: test_app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f .github/workflows/bootstrap-flutter.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 1
          fi
          git commit -m "Initialize Flutter Android project"
          git push origin HEAD:main
